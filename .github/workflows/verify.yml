name: Shared verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local

    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: squirrel
          POSTGRES_PASSWORD: squirrel
          POSTGRES_DB: squirrel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squirrel -d squirrel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Install project gate tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Full project gate
        env:
          POSTGRES_TEST_DSN: postgres://squirrel:squirrel@localhost:5432/squirrel_test?sslmode=disable
        run: bash scripts/test-all.sh

      - name: Release script contracts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          bash scripts/prepare-release-test.sh
          python3 scripts/release-candidate-test.py
          python3 scripts/security-report-test.py

  minimum:
    name: Minimum supported Go
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: squirrel
          POSTGRES_PASSWORD: squirrel
          POSTGRES_DB: squirrel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squirrel -d squirrel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install project gate tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Full project gate on supported minimum
        env:
          POSTGRES_TEST_DSN: postgres://squirrel:squirrel@localhost:5432/squirrel_test?sslmode=disable
        run: |
          go version
          bash scripts/test-all.sh

  security:
    name: Security
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
      - name: Install pinned scanner
        run: GOBIN="$RUNNER_TEMP/vuln-bin" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Scan
        id: scan
        run: bash scripts/security-report.sh "$RUNNER_TEMP/vuln-bin/govulncheck" "$RUNNER_TEMP/security-report"
      - name: Report incomplete scan
        if: always() && steps.scan.outcome == 'skipped'
        run: |
          mkdir -p "$RUNNER_TEMP/security-report"
          echo '## Security scan incomplete: checkout, setup or scanner installation failed. See job logs; no clean result is available.' | tee "$RUNNER_TEMP/security-report/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security
          path: ${{ runner.temp }}/security-report
          if-no-files-found: error
